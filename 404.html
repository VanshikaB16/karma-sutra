<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karma Sutra™ — Interactive 3D Cosmic Orrery</title>
    <!-- Google Fonts: Cormorant Garamond & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
:root {
  --bg-space: #07080e;
  --bg-surface: #0c0e1c;
  --bg-card: rgba(13, 16, 29, 0.82);
  --bg-card-hover: rgba(22, 27, 48, 0.9);
  --border-glow: rgba(0, 245, 212, 0.35);
  --border-subtle: rgba(229, 224, 216, 0.12);
  --accent-cyan: #00f5d4;
  --accent-purple: #9d4edd;
  --accent-gold: #ffd166;
  --accent-maroon: #713b45;
  --accent-sage: #74816b;
  --text-primary: #f7f5f0;
  --text-muted: #8b8f9e;
  --text-dim: #5c6070;
  --font-serif: "Cormorant Garamond", Georgia, serif;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

html, body, #root {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-space);
  color: var(--text-primary);
  font-family: var(--font-sans);
  user-select: none;
}

/* ===================================================================
   APP LAYOUT & 3D CANVAS
   =================================================================== */
.cosmic-app-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-color: var(--bg-space);
}

.cosmic-canvas-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

.cosmic-canvas-container canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

/* ===================================================================
   HEADER NAVIGATION
   =================================================================== */
.cosmic-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  height: 64px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(7, 8, 14, 0.72);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-subtle);
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 20px;
}

.brand-badge-group {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.brand-sparkle {
  color: var(--accent-cyan);
  font-size: 16px;
  transition: transform 0.3s ease;
}

.brand-badge-group:hover .brand-sparkle {
  transform: rotate(45deg) scale(1.2);
}

.brand-title {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-pill {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(0, 245, 212, 0.15);
  border: 1px solid rgba(0, 245, 212, 0.35);
  color: var(--accent-cyan);
}

.brand-tagline {
  font-size: 11px;
  color: var(--text-muted);
  font-style: italic;
  letter-spacing: 0.02em;
}

/* Quick planet navigation bar in header */
.planet-nav-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding-left: 20px;
  border-left: 1px solid rgba(255, 255, 255, 0.1);
}

.planet-nav-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  font-family: var(--font-sans);
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
}

.planet-nav-btn:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.08);
}

.planet-nav-btn.active {
  background: rgba(0, 245, 212, 0.15);
  border-color: rgba(0, 245, 212, 0.4);
  color: var(--accent-cyan);
  font-weight: 600;
}

.planet-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
}

/* Header User Profile & Actions */
.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.telemetry-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 20px;
  font-family: var(--font-mono);
  font-size: 11px;
  background: rgba(12, 14, 28, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--text-muted);
}

.status-dot-pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 8px #10b981;
  animation: pulseGlow 2s infinite;
}

.karma-badge {
  background: rgba(255, 209, 102, 0.15);
  border: 1px solid rgba(255, 209, 102, 0.35);
  color: var(--accent-gold);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
}

.tier-badge {
  background: rgba(157, 78, 221, 0.15);
  border: 1px solid rgba(157, 78, 221, 0.35);
  color: #c77dff;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 6px;
}

/* ===================================================================
   PLANETARY HUD (INFORMATION PANEL)
   =================================================================== */
.planet-hud {
  position: fixed;
  top: 80px;
  right: 24px;
  z-index: 25;
  width: 390px;
  max-width: calc(100vw - 48px);
  max-height: calc(100vh - 104px);
  background: var(--bg-card);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border-glow);
  border-radius: 14px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 245, 212, 0.1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.hud-header {
  padding: 20px 22px 14px 22px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  background: rgba(0, 0, 0, 0.25);
}

.station-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--accent-cyan);
  text-transform: uppercase;
  margin-bottom: 4px;
}

.hud-title {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 700;
  line-height: 1.25;
  color: #ffffff;
}

.hud-deity {
  font-size: 12px;
  color: var(--accent-gold);
  font-weight: 500;
  margin-top: 4px;
}

.hud-close-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.hud-close-btn:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.1);
}

.hud-tabs {
  display: flex;
  padding: 10px 20px;
  gap: 8px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.hud-tab-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 500;
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.hud-tab-btn.active {
  background: rgba(0, 245, 212, 0.16);
  border-color: rgba(0, 245, 212, 0.4);
  color: var(--accent-cyan);
  font-weight: 600;
}

.hud-body {
  padding: 18px 22px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.metrics-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.metric-card {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 8px;
  padding: 10px 12px;
}

.metric-title {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 5px;
}

.metric-value {
  font-size: 14px;
  font-weight: 600;
  color: #ffffff;
  margin-top: 4px;
}

.lore-card {
  background: rgba(18, 16, 26, 0.6);
  border: 1px solid rgba(255, 209, 102, 0.2);
  border-radius: 8px;
  padding: 12px;
  font-size: 12px;
  line-height: 1.5;
  color: #fce7b0;
  font-style: italic;
}

.desc-card {
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 8px;
  padding: 12px;
  font-size: 12px;
  line-height: 1.5;
  color: #d1d5db;
}

.card-tag {
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent-cyan);
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.transit-weather {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-muted);
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  padding-top: 10px;
}

.hud-footer {
  padding: 14px 22px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(0, 0, 0, 0.35);
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ===================================================================
   FLOATING UNIVERSE CONTROLS (BOTTOM-LEFT)
   =================================================================== */
.universe-controls-capsule {
  position: fixed;
  bottom: 24px;
  left: 24px;
  z-index: 25;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: rgba(12, 14, 26, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-subtle);
  border-radius: 30px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
}

.ctrl-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 7px 10px;
  border-radius: 20px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-family: var(--font-sans);
  transition: all 0.2s ease;
}

.ctrl-btn:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.1);
}

.ctrl-btn.active {
  color: var(--accent-cyan);
  background: rgba(0, 245, 212, 0.15);
  font-weight: 600;
}

.ctrl-divider {
  width: 1px;
  height: 16px;
  background: rgba(255, 255, 255, 0.1);
}

/* ===================================================================
   MODAL & FORMS
   =================================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  animation: fadeIn 0.25s ease forwards;
}

.modal-dialog {
  width: 520px;
  max-width: 95vw;
  max-height: 85vh;
  background: #0d1020;
  border: 1px solid rgba(0, 245, 212, 0.35);
  border-radius: 14px;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 245, 212, 0.15);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-header {
  padding: 18px 24px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0, 0, 0, 0.3);
}

.modal-title {
  font-family: var(--font-serif);
  font-size: 19px;
  font-weight: 700;
  color: #ffffff;
}

.modal-subtitle {
  font-size: 11px;
  color: var(--accent-gold);
  margin-top: 2px;
}

.modal-body {
  padding: 22px 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.form-label {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent-cyan);
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 8px;
  padding: 10px 12px;
  color: #ffffff;
  font-family: var(--font-sans);
  font-size: 12px;
  transition: border-color 0.2s ease;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--accent-cyan);
  box-shadow: 0 0 10px rgba(0, 245, 212, 0.2);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.decree-parchment {
  background: #05060b;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  color: #e5e7eb;
  white-space: pre-wrap;
  max-height: 280px;
  overflow-y: auto;
}

/* ===================================================================
   BUTTONS
   =================================================================== */
.btn-primary {
  background: linear-gradient(135deg, #7b2cbf 0%, #0f9b8e 100%);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  padding: 9px 18px;
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-primary:hover {
  background: linear-gradient(135deg, #9d4edd 0%, #00f5d4 100%);
  box-shadow: 0 4px 18px rgba(0, 245, 212, 0.35);
  transform: translateY(-1px);
}

.btn-secondary {
  background: rgba(20, 22, 40, 0.7);
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 9px 16px;
  font-family: var(--font-sans);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-secondary:hover {
  background: rgba(30, 34, 60, 0.9);
  border-color: var(--accent-cyan);
  color: #ffffff;
}

/* Hover Tooltip in 3D Space */
.hover-tooltip {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  pointer-events: none;
  background: rgba(10, 12, 22, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(0, 245, 212, 0.35);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 12px;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
  animation: fadeIn 0.2s ease forwards;
}

/* Animations */
@keyframes slideInRight {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes pulseGlow {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

  </style>
  <script type="module" crossorigin src="./assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index.css">
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
