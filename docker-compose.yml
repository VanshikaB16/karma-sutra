version: '3.8'

services:
  # ===================================================================
  # 1. Dedicated MySQL 8.0 Relational Akashic Ledger
  # ===================================================================
  db:
    image: mysql:8.0
    container_name: karma-sutra-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_108
      MYSQL_DATABASE: karma_sutra_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_108"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karma-net

  # ===================================================================
  # 2. KARMA SUTRA™ Full-Stack Service (Java 21 + 3D Orrery Web)
  # ===================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karma-sutra-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: karma_sutra_db
      DB_USER: root
      DB_PASSWORD: root_password_108
      COSMIC_PORT: 8108
      VITE_PORT: 5173
      AI_PROVIDER: ${AI_PROVIDER:-GEMINI}
      AI_MODEL: ${AI_MODEL:-gemini-1.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8108:8108"
      - "5173:5173"
    networks:
      - karma-net

volumes:
  mysql_data:
    driver: local

networks:
  karma-net:
    driver: bridge
